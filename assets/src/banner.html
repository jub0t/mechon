<!doctype html>
<!--
  Source for assets/banner.png (GitHub social preview, 1280x640). The right side is a real
  screenshot of the dashboard (shot.png, written by screens.sh). Render: node assets/src/render.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mechon banner</title>
<style>
  @font-face { font-family: Bricolage; src: url(../../web/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2) format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; }
  @font-face { font-family: Geist; src: url(../../web/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: GeistMono; src: url(../../web/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }

  :root {
    --bg: oklch(0.13 0.004 285);
    --surface: oklch(0.17 0.004 285);
    --surface-2: oklch(0.22 0.004 285);
    --fg: oklch(0.97 0.008 90);
    --muted: oklch(0.74 0.008 285);
    --faint: oklch(0.54 0.008 285);
    --border: oklch(1 0 0 / 0.1);
    --brand: oklch(0.62 0.22 300);
    --brand-soft: oklch(0.62 0.22 300 / 0.16);
    --brand-text: oklch(0.8 0.12 300);
    --orange: oklch(0.8 0.16 60);
    --orange-soft: oklch(0.8 0.16 60 / 0.16);
    --orange-text: oklch(0.86 0.12 70);
    --success: oklch(0.74 0.15 155);
    --success-soft: oklch(0.74 0.15 155 / 0.14);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  canvas { position: absolute; inset: 0; width: 100%; height: 100%;
    -webkit-mask-image: radial-gradient(ellipse 55% 60% at 22% 100%, black 10%, transparent 70%); opacity: 0.5; }

  .wrap { position: relative; height: 100%; display: grid; grid-template-columns: 540px; align-items: center; padding: 0 64px; }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 40px; height: 40px; }
  .brand span { font-family: Bricolage; font-weight: 700; font-size: 26px; letter-spacing: -0.02em; }

  h1 { margin-top: 34px; font-family: Bricolage; font-weight: 700; font-size: 60px; line-height: 0.96; letter-spacing: -0.035em; font-variation-settings: "opsz" 96; }
  h1 em { font-style: normal; color: var(--brand-text); }
  p.lede { margin-top: 22px; font-size: 21px; line-height: 1.45; color: var(--muted); max-width: 34ch; }

  .chips { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 14.5px; font-weight: 600; }
  .chip b { color: var(--fg); font-weight: 600; }

  /* Right: a real screenshot of the dashboard, bleeding off the right and bottom edges. */
  .shot { position: absolute; left: 640px; top: 96px; width: 900px; height: 600px; border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px oklch(1 0 0 / 0.12), 0 40px 80px -30px oklch(0 0 0 / 0.9); }
  /* Crop to the main content (the sidebar is 264px wide) so nothing is cut mid-word. */
  .shot img { display: block; width: 1440px; transform-origin: 0 0; transform: scale(0.86) translate(-290px, -14px); }
</style>
</head>
<body>
<canvas id="slats"></canvas>
<div class="wrap">
  <div>
    <div class="brand">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#8b4fe8"/><rect x="7" y="9" width="4.5" height="14" rx="2.25" fill="#fff"/><rect x="13.75" y="13" width="4.5" height="10" rx="2.25" fill="#fff" opacity=".7"/><rect x="20.5" y="9" width="4.5" height="14" rx="2.25" fill="#fff"/></svg>
      <span>Mechon</span>
    </div>
    <h1>Start your own <em>bot hosting</em> company.</h1>
    <p class="lede">The open-source panel that runs every Discord bot in its own sandbox, on your servers.</p>
    <div class="chips">
      <span class="chip"><b>Self-hosted</b></span>
      <span class="chip"><b>Multi-tenant</b> plans</span>
      <span class="chip">MIT</span>
    </div>
  </div>

  <div class="shot"><img src="shot.png" alt="" /></div>
</div>

<script>
  // One still frame of the panel's slat field (same drawing as web/src/components/backdrop/slat-field.tsx).
  const c = document.getElementById('slats')
  const dpr = window.devicePixelRatio || 1
  const w = 1280, h = 640
  c.width = w * dpr; c.height = h * dpr
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr)
  const VIOLET = [139, 79, 232], GLINT = [233, 213, 255]
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t))
  const px = 260, py = 600, t = 5200
  for (let r = 0; r < h / 27 + 1; r++) {
    const ox = r % 2 ? 6.5 : 0, y = r * 27
    for (let col = 0; col < w / 13 + 1; col++) {
      const x = col * 13 + ox
      const wave = Math.sin(x * 0.011 + y * 0.006 - t * 0.0011) * Math.cos(y * 0.009 - x * 0.003 + t * 0.0006)
      const level = (wave + 1) / 2
      const dx = x - px, dy = y - py
      const pull = Math.exp(-(dx * dx + dy * dy) / (2 * 260 * 260))
      const sh = 18 * Math.min(0.35 + 0.65 * level * level + 0.55 * pull, 1.35)
      const glint = Math.min(1, Math.max(0, (level - 0.82) * 4) + pull * 0.9)
      const [cr, cg, cb] = mix(VIOLET, GLINT, glint)
      const a = Math.min(0.1 + 0.55 * level ** 3 + 0.6 * pull, 0.95)
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${a})`
      ctx.beginPath(); ctx.roundRect(x - 2.5, y - sh / 2, 5, sh, 2.5); ctx.fill()
    }
  }
</script>
</body>
</html>
